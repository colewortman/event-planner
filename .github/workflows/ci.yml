name: ci

on:
  pull_request:
    branches: [master]

jobs:
  test-app:
    name: Build & Test App
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: eventp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Install PostgreSQL client
        run: sudo apt-get install -y postgresql-client

      - name: Build database
        run: |
          export PGPASSWORD=password
          cd eventp-api
          psql -U postgres -d eventp -h localhost -f ./resources/db-delete.sql
          psql -U postgres -d eventp -h localhost -f ./resources/db-create.sql
          psql -U postgres -d eventp -h localhost -f ./resources/db-insert.sql

      - name: Install API dependencies
        run: |
          cd eventp-api
          npm install

      - name: Build React app
        run: npm run build

      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.29.2/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose version
      
      - name: Build and run all docker containers
        run: docker-compose up --build -d
      
      - name: Run curl tests
        run: |
          sleep 10 # Wait for services to start
          curl -f http://localhost:5000/api/events || exit 1
          curl -f http://localhost:5000/api/users || exit 1
          curl -f http://localhost:3000 || exit 1
        